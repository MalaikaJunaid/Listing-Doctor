<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listing Doctor Extension Settings</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #292326; background: #fbf8f8; }
    * { box-sizing: border-box; }
    body { max-width: 620px; margin: 45px auto; padding: 0 20px; }
    .card { padding: 24px; border: 1px solid #eee7e9; border-radius: 13px; background: white; }
    header { display: flex; align-items: center; gap: 12px; }
    header img { width: 48px; height: 48px; border-radius: 10px; }
    h1 { margin: 0; font-size: 20px; }
    .subtitle, .note { color: #7d7478; font-size: 12px; line-height: 1.55; }
    label { display: block; margin: 22px 0 7px; font-size: 12px; font-weight: 650; }
    input { width: 100%; padding: 11px; border: 1px solid #ddd3d7; border-radius: 7px; font: inherit; font-size: 13px; }
    input:focus { border-color: #d7193f; outline: 2px solid #fff0f2; }
    button { margin-top: 12px; padding: 10px 14px; border: 0; border-radius: 7px; background: #d7193f; color: white; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
    button:hover { background: #b91536; }
    .status { min-height: 18px; color: #6b7338; font-size: 11px; }
    .note { margin-top: 16px; }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <img src="assets/ld-icon-128.png" alt="">
      <div><h1>Listing Doctor</h1><p class="subtitle">Browser extension settings</p></div>
    </header>
    <form id="settingsForm">
      <label for="appUrl">Listing Doctor app URL</label>
      <input id="appUrl" type="url" required placeholder="https://your-app.vercel.app/" autocomplete="url">
      <p class="note">For local development, use http://localhost:3000/. For your deployed app, enter its HTTPS URL. The extension opens this app with selected listing text in the page fragment; the app removes it from the address bar after loading.</p>
      <button type="submit">Save app URL</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
